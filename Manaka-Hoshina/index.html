<style>
  .drive-box {
    max-width: 700px;
    margin: 30px auto;
    padding: 28px 20px;
    text-align: center;
    background: linear-gradient(145deg, #18181d, #101014);
    border: 1px solid #292930;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    font-family: Arial, Helvetica, sans-serif;
  }

  .drive-box h1 {
    margin: 0;
    color: #fff;
    font-size: 27px;
    font-weight: 700;
  }

  .drive-box p {
    margin: 8px 0 20px;
    color: #999;
    font-size: 14px;
  }

  .drive-btn {
    display: inline-block;
    padding: 11px 18px;
    border-radius: 11px;
    background: #24242b;
    border: 1px solid #3a3a44;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: 0.2s;
  }

  .drive-btn:hover {
    background: #303039;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }

  @media (max-width: 600px) {
    .drive-box {
      margin: 20px 8px;
      padding: 23px 15px;
    }

    .drive-box h1 {
      font-size: 23px;
    }
  }
</style>

<div class="drive-box">
  <h1>Manaka Hoshina</h1>

  <p>Video Gallery</p>

  <a
    class="drive-btn"
    href="https://drive.google.com/drive/folders/1o5xtMfg8zCyar0xmkyDs5yOF8ygq1JWk?usp=sharing"
    target="_blank"
    rel="noopener"
  >
    📁 Buka Folder Google Drive
  </a>
</div>
