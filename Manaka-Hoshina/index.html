<style>
.drive-box{
  width:100% !important;
  max-width:850px !important;
  margin:10px auto !important;
  padding:35px 20px !important;
  text-align:center !important;
  background:linear-gradient(145deg,#18181d,#101014) !important;
  border:1px solid #303038 !important;
  border-radius:20px !important;
  box-shadow:0 10px 30px rgba(0,0,0,.35) !important;
  font-family:Arial,Helvetica,sans-serif !important;
}

.drive-box h1{
  margin:0 0 10px !important;
  color:#fff !important;
  font-size:32px !important;
  font-weight:700 !important;
}

.drive-box p{
  margin:0 0 25px !important;
  color:#aaa !important;
  font-size:17px !important;
}

.drive-btn{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  width:100% !important;
  min-height:62px !important;
  padding:14px 20px !important;
  background:linear-gradient(135deg,#292930,#1d1d23) !important;
  border:1px solid #44444e !important;
  border-radius:14px !important;
  color:#fff !important;
  text-decoration:none !important;
  font-size:18px !important;
  font-weight:700 !important;
  cursor:pointer !important;
}

.drive-btn:hover{
  background:linear-gradient(135deg,#35353e,#24242b) !important;
  transform:translateY(-2px);
}

@media(max-width:600px){

  .drive-box{
    width:calc(100% - 8px) !important;
    margin:6px auto !important;
    padding:32px 14px !important;
  }

  .drive-box h1{
    font-size:29px !important;
  }

  .drive-box p{
    font-size:16px !important;
    margin-bottom:22px !important;
  }

  .drive-btn{
    min-height:64px !important;
    font-size:18px !important;
  }
}
</style>

<div class="drive-box">

  <h1>Manaka Hoshina</h1>

  <p>Video Gallery</p>

  <a
    class="drive-btn"
    href="https://drive.google.com/drive/folders/1o5xtMfg8zCyar0xmkyDs5yOF8ygq1JWk?usp=sharing"
    target="_blank"
    rel="noopener noreferrer"
  >
    📁 Buka Folder Google Drive
  </a>

</div>
