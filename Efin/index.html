    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #181818;
        border-bottom: 1px solid #333;
        padding: 14px;
      }
      .head {
        max-width: 1400px;
        margin: auto;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(22px, 4vw, 30px);
      }
      .search {
        width: 100%;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #222;
        color: #fff;
        font-size: 15px;
      }
      main {
        max-width: 1400px;
        margin: auto;
        padding: 16px 14px 40px;
      }
      h2 {
        font-size: clamp(18px, 3vw, 23px);
        margin: 24px 0 12px;
      }
      .count {
        color: #999;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
      }
      .card {
        background: #1b1b1b;
        border: 1px solid #303030;
        border-radius: 9px;
        overflow: hidden;
        min-width: 0;
      }
      .media {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16/9;
        background: #000;
        object-fit: contain;
      }
      img.media {
        object-fit: cover;
        cursor: pointer;
      }
      .name {
        padding: 9px 10px 11px;
        font-size: 13px;
        line-height: 1.35;
        word-break: break-word;
      }
      .empty {
        padding: 25px;
        color: #888;
      }
      @media (max-width: 600px) {
        header {
          padding: 10px 8px;
        }
        main {
          padding: 10px 8px 30px;
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }
        .name {
          font-size: 11px;
          padding: 7px 8px 9px;
        }
      }
      @media (max-width: 360px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

      function url(file) {
        return R2_BASE + encodeURIComponent(file).replace(/%2F/g, "/");
      }
      function esc(s) {
        return s.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c],
        );
      }
      function match(x, q) {
        return (
          !q ||
          x.name.toLowerCase().includes(q) ||
          x.file.toLowerCase().includes(q)
        );
      }
      function render() {
        const q = document.getElementById("search").value.trim().toLowerCase();

        const vi = videos.filter((x) => match(x, q));
