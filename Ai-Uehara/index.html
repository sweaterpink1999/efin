<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ai Uehara</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #181818;
        border-bottom: 1px solid #333;
        padding: 14px;
      }
      .head {
        max-width: 1400px;
        margin: auto;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(22px, 4vw, 30px);
      }
      .search {
        width: 100%;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #222;
        color: #fff;
        font-size: 15px;
      }
      main {
        max-width: 1400px;
        margin: auto;
        padding: 16px 14px 40px;
      }
      h2 {
        font-size: clamp(18px, 3vw, 23px);
        margin: 24px 0 12px;
      }
      .count {
        color: #999;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
      }
      .card {
        background: #1b1b1b;
        border: 1px solid #303030;
        border-radius: 9px;
        overflow: hidden;
        min-width: 0;
      }
      .media {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16/9;
        background: #000;
        object-fit: contain;
      }
      img.media {
        object-fit: cover;
        cursor: pointer;
      }
      .name {
        padding: 9px 10px 11px;
        font-size: 13px;
        line-height: 1.35;
        word-break: break-word;
      }
      .empty {
        padding: 25px;
        color: #888;
      }
      @media (max-width: 600px) {
        header {
          padding: 10px 8px;
        }
        main {
          padding: 10px 8px 30px;
        }

        /* HP: video 1 kolom agar tombol kontrol/fullscreen jelas */
        #videos {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        /* Gambar tetap 2 kolom di HP */
        #images {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }

        #videos .media {
          width: 100%;
          aspect-ratio: 16 / 9;
          min-height: 0;
        }

        #videos video {
          display: block;
        }

        .name {
          font-size: 11px;
          padding: 7px 8px 9px;
        }
      }
      @media (max-width: 360px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      /* Fullscreen image viewer */
      .image-lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.94);
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .image-lightbox.open {
        display: flex;
      }
      .image-lightbox img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 4px;
        user-select: none;
      }
      .lightbox-close {
        position: fixed;
        top: 12px;
        right: 16px;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 30px;
        line-height: 44px;
        cursor: pointer;
      }
      .lightbox-close:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      body.lightbox-open {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="head">
        <h1>Ai Uehara</h1>
        <input
          id="search"
          class="search"
          type="search"
          placeholder="Cari gambar atau video..."
        />
      </div>
    </header>

    <main>
      <div id="count" class="count"></div>
      <h2>🎬 Video</h2>
      <div id="videos" class="grid"></div>
      <h2>📷 Gambar</h2>
      <div id="images" class="grid"></div>
    </main>

    <div id="imageLightbox" class="image-lightbox" aria-hidden="true">
      <button class="lightbox-close" id="lightboxClose" aria-label="Tutup">
        ×
      </button>
      <img id="lightboxImage" src="" alt="" />
    </div>

    <script>
      /*
=========================================================
CARA EDIT / TAMBAH FILE
=========================================================
Folder R2 yang dipakai: Ai Uehara

VIDEO:
Untuk mengganti JUDUL yang tampil:
  name: "Judul yang kamu mau"

Untuk mengganti file:
  file: "nama-file-persis-di-R2.mp4"

Untuk menambah video, copy satu object lalu ubah name + file.

GAMBAR:
Bagian gambar sengaja DIKOSONGKAN.
Cari:
  const images = [

Untuk menambah gambar, masukkan:
  { name: "Gambar Baru", file: "gambar-baru.jpg" },

Upload gambar terlebih dahulu ke:
  R2 → video → Ai Uehara

URL R2 dibuat otomatis, jadi tidak perlu menulis URL panjang.

CONTOH:
  { name: "Video Baru", file: "video-baru.mp4" },
=========================================================
*/

      const R2_BASE =
        "https://pub-78c754fb607647a9b352da52a7749dfa.r2.dev/Ai%20Uehara/";

      const images = [
        // =====================================================
        // TAMBAH GAMBAR DI SINI
        //
        // Contoh:
        // { name: "Gambar 1", file: "gambar1.jpg" },
        // { name: "Gambar 2", file: "gambar2.jpg" },
        //
        // Upload gambar dulu ke:
        // R2 → video → Ai Uehara
        //
        // Lalu masukkan NAMA FILE persis seperti di R2.
        // Tidak perlu menulis URL Cloudflare.
        // =====================================================
      ];

      const videos = [
        {
          name: "1Pondo-091416_382 Watch Online Ai Uehara Ai Uehara Anal Special",
          file: "1Pondo-091416_382 Watch Online Ai Uehara Ai Uehara Anal Special.mp4",
        },
        {
          name: "Caribbeancom-090516-249 Watch Online Ai Uehara Anal picture book",
          file: "Caribbeancom-090516-249 Watch Online Ai Uehara Anal picture book.mp4",
        },
      ];

      function url(file) {
        return R2_BASE + encodeURIComponent(file).replace(/%2F/g, "/");
      }
      function esc(s) {
        return s.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c],
        );
      }
      function match(x, q) {
        return (
          !q ||
          x.name.toLowerCase().includes(q) ||
          x.file.toLowerCase().includes(q)
        );
      }
      function render() {
        const q = document.getElementById("search").value.trim().toLowerCase();
        const im = images.filter((x) => match(x, q));
        const vi = videos.filter((x) => match(x, q));

        document.getElementById("images").innerHTML = im.length
          ? im
              .map(
                (x) => `
    <article class="card">
      <img class="media" src="${url(x.file)}" alt="${esc(x.name)}" loading="lazy" onclick="openImage(this.src, this.alt)">
      <div class="name">${esc(x.name)}</div>
    </article>`,
              )
              .join("")
          : '<div class="empty">Tidak ada gambar.</div>';

        document.getElementById("videos").innerHTML = vi.length
          ? vi
              .map(
                (x) => `
    <article class="card">
      <video class="media" controls preload="metadata" playsinline>
        <source src="${url(x.file)}" type="video/mp4">
      </video>
      <div class="name">${esc(x.name)}</div>
    </article>`,
              )
              .join("")
          : '<div class="empty">Tidak ada video.</div>';

        document.getElementById("count").textContent =
          `${im.length} gambar • ${vi.length} video`;
      }

      function openImage(src, alt) {
        const box = document.getElementById("imageLightbox");
        const image = document.getElementById("lightboxImage");
        image.src = src;
        image.alt = alt || "";
        box.classList.add("open");
        box.setAttribute("aria-hidden", "false");
        document.body.classList.add("lightbox-open");
      }

      function closeImage() {
        const box = document.getElementById("imageLightbox");
        const image = document.getElementById("lightboxImage");
        box.classList.remove("open");
        box.setAttribute("aria-hidden", "true");
        image.src = "";
        document.body.classList.remove("lightbox-open");
      }

      document
        .getElementById("lightboxClose")
        .addEventListener("click", closeImage);

      document
        .getElementById("imageLightbox")
        .addEventListener("click", function (e) {
          if (e.target === this) closeImage();
        });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeImage();
      });

      document.getElementById("search").addEventListener("input", render);
      render();
    </script>
  </body>
</html>
